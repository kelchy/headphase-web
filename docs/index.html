<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .img {
            max-width: 100%;
            height: auto;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .form-group {
            display: flex;
            gap: 10px;
            max-width: 400px;
            margin: 0 auto;
        }
        input[type="email"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 1rem;
        }
        input[type="email"]:focus {
            border-color: #38bdf8;
        }
        button {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        button:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src=logo_dark.png class="img"></img>
        <h1>Something Awesome is Coming</h1>
        <p>We are working hard behind the scenes to bring you a brand new experience. Drop your email address below to get notified when we launch.</p>
        <form onsubmit="event.preventDefault(); alert('Thank you for subscribing!');">
            <div class="form-group">
                <input type="email" placeholder="Enter your email" required>
                <button type="submit">Notify Me</button>
            </div>
        </form>
    </div>
</body>
</html>
